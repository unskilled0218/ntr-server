# Pull the amd64/arm64 Forgejo image; no Rust toolchain or source mount is needed.
# See docs/docker-compose.md for registry login, deployment, and data permissions.
services:
  ntr-server:
    image: git.lan/ntr/ntr-server:0.2.4
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

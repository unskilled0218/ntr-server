<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my-ntr-server</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <h1>todo</h1>

      <form id="add-form" autocomplete="off">
        <input
          id="add-input"
          type="text"
          placeholder="Add a task, e.g. (A) call bank +finance @phone due:2026-06-30"
          aria-label="New task"
        />
        <button type="submit">Add</button>
      </form>

      <div id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
        <input id="tag-filter" type="text" placeholder="filter +project or @context" aria-label="Tag filter" />
      </div>

      <ul id="tasks"></ul>
      <p id="empty" hidden>No tasks.</p>
      <p id="error" role="alert" hidden></p>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>

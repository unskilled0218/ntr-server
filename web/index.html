<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my-ntr-server</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <h1>todo</h1>

      <form id="add-form" autocomplete="off">
        <div class="add-row">
          <input
            id="add-input"
            type="text"
            placeholder="Add a task, e.g. call bank"
            aria-label="New task"
          />
          <button type="submit">Add</button>
        </div>
        <div class="add-fields">
          <label>
            Priority
            <select id="add-priority" aria-label="Priority"></select>
          </label>
          <label>
            Due
            <input id="add-due" type="date" aria-label="Due date" />
          </label>
          <div class="dropdown" data-kind="project">
            <span class="field-label">Projects</span>
            <button
              type="button"
              class="dropdown-toggle"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Select projects
            </button>
            <div class="dropdown-panel" hidden>
              <div class="dropdown-options"></div>
              <button type="button" class="dropdown-add">+ Add project</button>
            </div>
          </div>
          <div class="dropdown" data-kind="context">
            <span class="field-label">Contexts</span>
            <button
              type="button"
              class="dropdown-toggle"
              aria-haspopup="true"
              aria-expanded="false"
            >
              Select contexts
            </button>
            <div class="dropdown-panel" hidden>
              <div class="dropdown-options"></div>
              <button type="button" class="dropdown-add">+ Add context</button>
            </div>
          </div>
        </div>
      </form>

      <dialog id="label-modal">
        <form id="label-form">
          <h2 id="label-modal-title">Add project</h2>
          <label>
            Name
            <input id="label-input" type="text" autocomplete="off" />
          </label>
          <p id="label-error" class="modal-error" role="alert" hidden></p>
          <div class="modal-actions">
            <button type="button" id="label-cancel">Cancel</button>
            <button type="submit">Add</button>
          </div>
        </form>
      </dialog>

      <div id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
        <input id="tag-filter" type="text" placeholder="filter +project or @context" aria-label="Tag filter" />
      </div>

      <ul id="tasks"></ul>
      <p id="empty" hidden>No tasks.</p>
      <p id="error" role="alert" hidden></p>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
